services:
  postgres:
    image: postgres:16-alpine
    container_name: iracus-logistic-postgres
    environment:
      POSTGRES_DB: iracus_logistic
      POSTGRES_USER: iracus
      POSTGRES_PASSWORD: iracus
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iracus -d iracus_logistic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
