services:
  postgres:
    image: postgres:16-alpine
    container_name: icaris-logistic-postgres
    environment:
      POSTGRES_DB: icaris_logistic
      POSTGRES_USER: icaris
      POSTGRES_PASSWORD: icaris
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icaris -d icaris_logistic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
