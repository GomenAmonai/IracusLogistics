name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: icaris_logistic
          POSTGRES_USER: icaris
          POSTGRES_PASSWORD: icaris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U icaris -d icaris_logistic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Прогоняем миграции и интеграционные тесты репозиториев против сервис-контейнера
      # (иначе они само-пропускаются и SQL/транзакции в CI не проверяются).
      DATABASE_URL: postgres://icaris:icaris@localhost:5432/icaris_logistic?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Migrate up
        run: go run ./cmd/migrate up

      # Проверяем обратимость свежей миграции (database.md: тестировать оба направления),
      # затем возвращаем схему вверх — тесты репозиториев ждут полную схему.
      - name: Migrate down/up roundtrip
        run: go run ./cmd/migrate down && go run ./cmd/migrate up

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
